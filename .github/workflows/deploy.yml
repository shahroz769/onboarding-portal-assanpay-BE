name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e

            APP_DIR="/var/www/onboarding-portal-assanpay-BE"
            BUN="/home/ubuntu/.bun/bin/bun"

            cd "$APP_DIR"

            echo "Current commit before deployment:"
            git log --oneline -1

            git fetch origin main
            git reset --hard origin/main

            "$BUN" install --frozen-lockfile

            pm2 restart onboarding-backend --update-env
            pm2 save

            echo "Deployed commit:"
            git log --oneline -1

            pm2 status